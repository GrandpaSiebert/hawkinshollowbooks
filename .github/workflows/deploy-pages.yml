name: Deploy Hawkins Hollow to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Cloudflare Library canon
        run: node scripts/restore-library-canon.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hawkins-hollow-library

      - name: Publish verified freebie title-art derivatives
        run: npm run publish:freebie-title-art -- --apply
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hawkins-hollow-library

      - name: Restore trusted production state and select deployment date
        run: |
          echo "HH_SITEMAP_DEPLOYMENT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          node scripts/indexnow-deployment.js restore
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build site
        run: npm run build
        env:
          REQUIRE_FREEBIE_TITLE_ART_PUBLICATION: 'true'
          HH_ENTITY_ID_STRICT: '1'
          HH_SITEMAP_DEPLOYMENT_DATE: ${{ env.HH_SITEMAP_DEPLOYMENT_DATE }}

      - name: Verify required pages exist
        run: |
          test -f build-recovery/books.html
          test -f build-recovery/start-here.html

      - name: Ensure Pages artifact markers
        run: |
          touch build-recovery/.nojekyll
          echo "hawkinshollowbooks.com" > build-recovery/CNAME

      - name: Copy IndexNow key file
        run: |
          cp e4b3aad43c3b4ece93f1a3b5b6962b38.txt build-recovery/e4b3aad43c3b4ece93f1a3b5b6962b38.txt

      - name: Prepare deployment-aware IndexNow delta
        run: npm run indexnow:prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-recovery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Finalize deployment-aware IndexNow
        id: indexnow
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        run: npm run indexnow:submit
        env:
          DEPLOYMENT_SUCCEEDED: 'true'

      - name: Retain production IndexNow state and receipt
        if: always() && steps.deployment.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-production-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .indexnow/state.json
            .indexnow/receipt.json
            .indexnow/plan.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

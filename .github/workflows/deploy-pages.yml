name: Deploy Hawkins Hollow to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Set deterministic sitemap deployment date
        run: echo "HH_SITEMAP_DEPLOYMENT_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Restore trusted Pages state (read-only)
        run: node scripts/indexnow-deployment.js restore
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # GitHub-hosted runners start with a fresh checkout; never target an owner's local Library.
      - name: Restore canonical inputs into the ephemeral runner Library
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_READONLY_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_READONLY_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READONLY_SECRET_ACCESS_KEY }}
          R2_BUCKET: hawkins-hollow-library
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "Dedicated read-only R2 credentials are required to restore canonical inputs." >&2
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/Library" ] || [ -L "$GITHUB_WORKSPACE/Library" ]; then
            echo "Refusing to restore into an existing Library directory."
            exit 1
          fi
          node scripts/restore-library-canon.js --r2-only --destination "$GITHUB_WORKSPACE/Library"

      - name: Verify required published title-art dependencies (read-only)
        run: node scripts/verify-freebie-title-art-readonly.js

      - name: Run complete serial regression suite
        run: node --test --test-concurrency=1 test/*.test.js
        env:
          REQUIRE_FREEBIE_TITLE_ART_PUBLICATION: 'true'
          HH_ENTITY_ID_STRICT: '1'
          HH_SITEMAP_DEPLOYMENT_DATE: ${{ env.HH_SITEMAP_DEPLOYMENT_DATE }}

      - name: Build and validate the deployment artifact
        run: npm run build
        env:
          REQUIRE_FREEBIE_TITLE_ART_PUBLICATION: 'true'
          HH_ENTITY_ID_STRICT: '1'
          HH_SITEMAP_DEPLOYMENT_DATE: ${{ env.HH_SITEMAP_DEPLOYMENT_DATE }}

      - name: Verify required pages and Pages markers
        run: |
          test -f build-recovery/books.html
          test -f build-recovery/start-here.html
          test -f build-recovery/.nojekyll
          test -f build-recovery/CNAME
          test -f build-recovery/e4b3aad43c3b4ece93f1a3b5b6962b38.txt

      - name: Prepare deployment-aware IndexNow delta
        run: npm run indexnow:prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-recovery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Finalize deployment-aware IndexNow
        id: indexnow
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        run: npm run indexnow:submit
        env:
          DEPLOYMENT_SUCCEEDED: 'true'

      - name: Retain production IndexNow state and receipt
        if: always() && steps.deployment.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-production-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .indexnow/state.json
            .indexnow/receipt.json
            .indexnow/plan.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

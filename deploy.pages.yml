- name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Build site
    run: node [generate-site.js](http://_vscodecontentref_/1)

  - name: Ensure Pages artifact markers
    run: |
      touch build-recovery/.nojekyll
      echo "hawkinshollowbooks.com" > build-recovery/CNAME

  - name: Configure Pages
    uses: actions/configure-pages@v5

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: build-recovery

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
